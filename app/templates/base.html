<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vending Books{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="brand">Vending Books</div>
      <a href="/">Dashboard</a>
      <div class="section-label">Log entries</div>
      <a href="/collections">Collections</a>
      <a href="/restocks">Restocks</a>
      <a href="/commissions">Commissions</a>
      <a href="/maintenance">Maintenance</a>
      <div class="section-label">Manage</div>
      <a href="/machines">Machines</a>
      <a href="/sync">QuickBooks Sync</a>
      <a href="/settings">Settings</a>
    </nav>
    <main>
      {% for f in flashes %}
        <div class="flash {{ f.category }}">{{ f.message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
