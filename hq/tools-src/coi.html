<script>(()=>{"use strict";

const addDays=(iso,n)=>{const d=toDate(iso);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};

const fmt=iso=>iso?toDate(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"";

const S={db:null,loaded:{},readOnly:false};
const queues={};function q(path,fn){const p=(queues[path]||Promise.resolve()).then(fn,fn);queues[path]=p.catch(()=>{});return p;}

  return q(path,async()=>{ try{const r=S.db.doc(path); if(op==="set")await r.set(data); else if(op==="update")await r.update(data); else await r.delete();}
  catch(e){ if(e&&e.code==="invalid_argument"&&op!=="delete"){S.readOnly=true;} toast(e&&e.code==="quota_exceeded"?"Storage is full.":"Couldn't save: "+(e&&e.message||e)); throw e; } }); }

function modal(html,onMount){const root=$("#modalRoot");root.innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`;const bg=root.firstElementChild;const close=()=>{root.innerHTML="";document.removeEventListener("keydown",k);};const k=e=>{if(e.key==="Escape")close();};document.addEventListener("keydown",k);bg.addEventListener("click",e=>{if(e.target===bg)close();});onMount&&onMount(bg.firstElementChild,close);return close;}

    m.querySelector("[data-a=cancel]").onclick=()=>{c();res(null)};const d=m.querySelector("[data-a=del]");if(d)d.onclick=()=>{c();res({__delete:true})};

const SIG_HTML=`<div style="font-family:Arial,sans-serif;font-size:14px;"><a href="https://adaptpestpros.com/"><img src="https://ci3.googleusercontent.com/mail-sig/AIorK4ydiMyLf6zi1mdST0DCzX9oBYzCr1lMsx1K0q43JpveOtEh7T7b2GsLcVYa6FW2VnEF4Q69CbEUPpUD" width="96" height="96" alt="Adapt Pest Pros" style="display:block;border:0;"></a><br><b>Andrew MacIntosh</b><br>Adapt Pest Control Professionals<br><a href="tel:5036626443">503-662-6443</a><br><a href="https://adaptpestpros.com/">adaptpestpros.com</a><br><br><b><i>We are hiring all star Pest Pros!</i></b></div>`;

const DELIVER=[["me","Email it back to me"],["portal","Upload it directly to their vendor portal"],["pm","Email it to the property manager"]];
const STATUS=["Requested","Received","Uploaded to portal","Approved","Rejected — needs fix"];
const DEF_AGENTS=[{key:"adelie",name:"Adelie Risk Advisors",greet:"Alissa",to:"alissa.townsend@adelieriskadvisors.com",cc:"service@adelieriskadvisors.com",covers:["GL","WC","UMB"]},{key:"ben",name:"Ben March — COUNTRY Financial",greet:"Ben",to:"Benjamin.March@countryfinancial.com",cc:"",covers:["AUTO"]}];
S.holders={};S.requests={};
const UI={view:"new",hid:"",covs:{},type:"new",deliver:"me",pmEmail:"",site:"",issue:"",notes:"",sample:false,drafts:null,reqFilter:"open",hSearch:""};
const agents=()=>(S["config/agents"]&&S["config/agents"].list)||DEF_AGENTS;
const ALWAYS_CC="alex@adaptpestpros.com";
function guessCovs(h){const t=((h&&h.coverages)||"")+" "+((h&&h.endorsements)||"");const o={};if(/\bGL\b|general liab/i.test(t))o.GL=true;if(/\bWC\b|workers/i.test(t))o.WC=true;if(/umbrella|excess/i.test(t))o.UMB=true;if(/auto/i.test(t))o.AUTO=true;if(!Object.keys(o).length){o.GL=true;}return o;}
function buildDrafts(){
  const h=S.holders[UI.hid]; if(!h) return [];
  const sel=COVS.filter(([k])=>UI.covs[k]); const out=[];
  for(const a of agents()){ const mine=sel.filter(([k])=>a.covers.includes(k)); if(!mine.length) continue;
    const typeTxt={new:"a certificate of insurance",corrected:"a corrected certificate of insurance",endorse:"the endorsement forms",update:"an updated certificate of insurance"}[UI.type];
    const portal=[h.portal,h.vendorId?`vendor ID ${h.vendorId}`:""].filter(Boolean).join(", ");
    const lines=[`Hello ${a.greet},`,
      `Could you please send ${typeTxt} for ${h.name}?`,
      `Coverage: ${mine.map(([,l])=>l).join(", ")}`,
      h.holder?`Certificate holder:\n${h.holder}`:"",
      h.endorsements?`Required endorsements:\n${h.endorsements}`:"",
      h.coverages?`Required limits:\n${h.coverages}`:"",
      UI.site?`Job site / location: ${UI.site}`:"",
      UI.type==="corrected"&&UI.issue?`What was wrong with the last one: ${UI.issue}`:"",
      UI.sample?"I'm attaching their sample certificate.":"",
      UI.deliver==="portal"?`Please upload it directly to their vendor portal${portal?` (${portal})`:""}.`:UI.deliver==="pm"&&UI.pmEmail?`Please email it to ${UI.pmEmail} and copy me.`:"Please email it back to me when it's ready.",
      UI.notes||""].filter(Boolean);
    out.push({agent:a.key,agentName:a.name,to:a.to.split(/[;,]\s*/).filter(Boolean),cc:[...a.cc.split(/[;,]\s*/).filter(Boolean),ALWAYS_CC],subject:`COI request — ${h.name}${UI.type==="corrected"?" (corrected)":""}`,text:lines.join("\n\n"),covs:mine.map(([k])=>k)});
  }
  return out;
}
function renderNew(){
  const hs=Object.entries(S.holders).sort((a,b)=>a[1].name.localeCompare(b[1].name)), h=S.holders[UI.hid];
  if(!UI.drafts) UI.drafts=buildDrafts();
  const ds=UI.drafts;
  return `<div class="toolbar"><h2>New COI request</h2></div>
  <div class="cols"><div class="card">
   <div class="f"><label>Property management company</label><select id="hid"><option value="">— Choose —</option>${hs.map(([i,x])=>`<option value="${esc(i)}" ${UI.hid===i?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
   ${h?`<div class="hbox"><div class="small muted">Certificate holder</div><div class="pre">${esc(h.holder)||"<i>Not on file — add it</i>"}</div>
     ${h.endorsements?`<div class="small muted" style="margin-top:6px">Endorsements</div><div class="pre small">${esc(h.endorsements)}</div>`:""}
     ${h.coverages?`<div class="small muted" style="margin-top:6px">Required limits</div><div class="pre small">${esc(h.coverages)}</div>`:""}
     ${h.portal?`<div class="small muted" style="margin-top:6px">Portal</div><div class="small">${esc(h.portal)}${h.vendorId?` · ${esc(h.vendorId)}`:""}</div>`:""}
     <button class="btn ghost sm" data-eh="${esc(UI.hid)}">Edit holder info</button></div>`:""}
   <div class="f"><label>What do you need?</label><select id="rtype">${TYPES.map(([k,l])=>`<option value="${k}" ${UI.type===k?"selected":""}>${l}</option>`).join("")}</select></div>
   <div class="f"><label>Coverage</label>${COVS.map(([k,l])=>`<label class="chk"><input type="checkbox" data-cov="${k}" ${UI.covs[k]?"checked":""}> ${l} <span class="muted small">→ ${esc((agents().find(a=>a.covers.includes(k))||{}).name||"no agent set")}</span></label>`).join("")}</div>
   ${UI.type==="corrected"?`<div class="f"><label>What was wrong with the last one?</label><input id="issue" data-live value="${esc(UI.issue)}" placeholder="e.g. wrong certificate holder, missing endorsement"></div>`:""}
   <div class="f"><label>Job site / location (optional)</label><input id="site" data-live value="${esc(UI.site)}"></div>
   <div class="f"><label>Where should the agent send it?</label><select id="deliver">${DELIVER.map(([k,l])=>`<option value="${k}" ${UI.deliver===k?"selected":""}>${l}</option>`).join("")}</select>${UI.deliver==="pm"?`<input id="pmEmail" data-live style="margin-top:6px;width:100%" placeholder="Property manager email" value="${esc(UI.pmEmail)}">`:""}</div>
   <label class="chk"><input type="checkbox" id="sample" ${UI.sample?"checked":""}> I'm attaching their sample certificate (you add the file in Gmail)</label>
   <div class="f" style="margin-top:8px"><label>Anything else (optional)</label><textarea id="notes" data-live>${esc(UI.notes)}</textarea></div>
  </div>
  <div>${!h?`<div class="empty">Choose a company to build the request.</div>`:!ds.length?`<div class="empty">Tick at least one coverage.</div>`:ds.map((d,i)=>`<div class="card" style="margin-bottom:12px"><div class="small muted">Email ${i+1} of ${ds.length} · to ${esc(d.agentName)}</div>
     <div class="f"><label>To</label><input data-dk="${i}|to" data-live value="${esc(d.to.join(", "))}"></div>
     <div class="f"><label>CC</label><input data-dk="${i}|cc" data-live value="${esc(d.cc.join(", "))}"></div>
     <div class="f"><label>Subject</label><input data-dk="${i}|subject" data-live value="${esc(d.subject)}"></div>
     <div class="f"><label>Message (your signature is added automatically)</label><textarea data-dk="${i}|text" data-live style="min-height:300px">${esc(d.text)}</textarea></div></div>`).join("")+
     `<div class="mfoot" style="justify-content:flex-start"><button class="btn" id="makeDrafts">Create ${ds.length>1?ds.length+" drafts":"draft"} in Gmail</button><button class="btn sec" id="copyDrafts">Copy text</button><button class="btn ghost" id="resetDrafts">Reset wording</button></div>
     <div class="small muted">Drafts go to info@adaptpestpros.com's Drafts folder. Nothing is sent until you send it. The request is logged as soon as the draft is created.</div>`}</div></div>`;
}
function renderLog(){
  const today=todayISO();
  let rows=Object.entries(S.requests).sort((a,b)=>(b[1].date||"").localeCompare(a[1].date||""));
  const open=r=>!["Approved"].includes(r.status);
  if(UI.reqFilter==="open") rows=rows.filter(([,r])=>open(r)); if(UI.reqFilter==="due") rows=rows.filter(([,r])=>open(r)&&validISO(r.followUp)&&r.followUp<=today);
  const nDue=Object.values(S.requests).filter(r=>open(r)&&validISO(r.followUp)&&r.followUp<=today).length;
  return `<div class="toolbar"><h2>Request log</h2><div class="chips">${[["open","Open"],["due",`Follow-up due (${nDue})`],["all","All"]].map(([k,l])=>`<button class="chip ${UI.reqFilter===k?"on":""}" data-rf="${k}">${l}</button>`).join("")}</div><button class="btn sec" id="addReq">+ Log a request by hand</button></div>
  ${rows.length?`<div class="tablewrap"><table class="resp"><tr><th>Requested</th><th>Company</th><th>Agent · coverage</th><th>Status</th><th>Follow up</th><th></th></tr>${rows.map(([id,r])=>{const due=open(r)&&validISO(r.followUp)&&r.followUp<=today;return `<tr><td>${fmt(r.date)}<div class="small muted">${esc((TYPES.find(t=>t[0]===r.type)||[,""])[1])}</div></td><td><b>${esc(r.company)}</b>${r.notes?`<div class="small muted">${esc(r.notes)}</div>`:""}</td><td class="small">${esc(r.agentName)}<br>${esc((r.covs||[]).map(k=>(COVS.find(c=>c[0]===k)||[,k])[1]).join(", "))}</td>
  <td><select class="inl" data-rq="${id}|status">${STATUS.map(s=>`<option ${r.status===s?"selected":""}>${s}</option>`).join("")}</select></td>
  <td><input class="inl ${due?"od":""}" type="date" data-rq="${id}|followUp" value="${esc(r.followUp)}">${due?`<div class="small" style="color:#B91C1C">Follow up now</div>`:""}</td>
  <td style="white-space:nowrap">${open(r)?`<button class="btn sec sm" data-fu="${id}">Draft follow-up</button> `:""}${r.draftUrl?`<a class="small" href="${esc(r.draftUrl)}" target="_blank" rel="noopener">Draft</a> `:""}<button class="btn ghost sm" data-er="${id}">Edit</button></td></tr>`;}).join("")}</table></div>`:`<div class="empty">No requests ${UI.reqFilter==="all"?"yet":"here"}.</div>`}`;
}
function renderHolders(){
  const s=UI.hSearch.toLowerCase();
  const hs=Object.entries(S.holders).filter(([,h])=>!s||[h.name,h.holder,h.portal,h.vendorId].join(" ").toLowerCase().includes(s)).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  return `<div class="toolbar"><h2>Certificate holders <span class="small muted">${Object.keys(S.holders).length}</span></h2><input id="hSearch" placeholder="Search…" value="${esc(UI.hSearch)}" style="flex:1;max-width:300px"><button class="btn" data-eh="">+ Company</button></div>
  <div class="tablewrap"><table class="resp"><tr><th>Company</th><th>Certificate holder wording</th><th>Endorsements</th><th>Portal</th></tr>${hs.map(([i,h])=>`<tr class="rowedit" data-ehr="${esc(i)}"><td><b>${esc(h.name)}</b>${h.notes?`<div class="small muted">${esc(h.notes)}</div>`:""}</td><td class="small pre">${esc(h.holder)||'<span class="muted">—</span>'}</td><td class="small">${esc(h.endorsements)||'<span class="muted">—</span>'}</td><td class="small">${esc(h.portal)}${h.vendorId?`<br>${esc(h.vendorId)}`:""}</td></tr>`).join("")}</table></div>`;
}
function renderAgents(){
  return `<div class="toolbar"><h2>Insurance agents</h2><button class="btn" data-ea="">+ Agent</button></div>
  <div class="small muted" style="margin-bottom:10px">Each coverage is routed to the agent who handles it. Alex (${ALWAYS_CC}) is copied on every draft.</div>
  <div class="grid">${agents().map((a,i)=>`<div class="card click" data-ea="${i}"><h3>${esc(a.name)}</h3><div class="small">To: ${esc(a.to)}${a.cc?`<br>CC: ${esc(a.cc)}`:""}<br>Greeting: Hello ${esc(a.greet)},</div><div style="margin-top:6px">${a.covers.map(k=>`<span class="badge b-green">${esc((COVS.find(c=>c[0]===k)||[,k])[1])}</span>`).join("")}</div></div>`).join("")}</div>`;
}
async function editHolder(id){
  const h=id?S.holders[id]:{};
  const v=await form(id?`Edit ${h.name}`:"Add company",[{k:"name",label:"Company name",value:h.name},{k:"holder",label:"Certificate holder wording (exactly as it must appear)",type:"textarea",value:h.holder},{k:"endorsements",label:"Endorsements required",type:"textarea",value:h.endorsements},{k:"coverages",label:"Required coverages and limits",type:"textarea",value:h.coverages},{k:"portal",label:"Vendor portal",value:h.portal,list:["RealPage Vendor Credentialing","NetVendor","Yardi VendorCafe / VendorShield","AppFolio Vendor Portal","None"]},{k:"vendorId",label:"Vendor ID",value:h.vendorId},{k:"notes",label:"Notes",type:"textarea",value:h.notes}],{del:!!id});
  if(!v) return; if(v.__delete){ if(await confirmBox(`Remove ${h.name}?`)) await w(`holders/${id}`,"delete"); return; }
  if(!v.name){toast("Name is required");return;}
  if(id) await w(`holders/${id}`,"update",v); else { const nid=newId("holders"); await w(`holders/${nid}`,"set",v); UI.hid=nid; }
  UI.drafts=null; toast("Saved");
}
async function editAgent(i){
  const list=[...agents()], a=i===""?{covers:[]}:list[+i];
  const v=await form(i===""?"Add agent":`Edit ${a.name}`,[{k:"name",label:"Agent / agency",value:a.name},{k:"greet",label:"Greeting name (Hello ___,)",value:a.greet},{k:"to",label:"To (comma-separated)",value:a.to},{k:"cc",label:"CC (comma-separated, optional)",value:a.cc},{k:"covers",label:"Handles (GL, WC, UMB, AUTO — comma-separated)",value:(a.covers||[]).join(", ")}],{del:i!==""});
  if(!v) return; if(v.__delete) list.splice(+i,1); else { const o={key:a.key||("a"+Date.now()),name:v.name,greet:v.greet,to:v.to,cc:v.cc,covers:v.covers.split(/[,\s]+/).map(x=>x.toUpperCase()).filter(x=>["GL","WC","UMB","AUTO"].includes(x))}; if(i==="") list.push(o); else list[+i]=o; }
  await w("config/agents","set",{list}); UI.drafts=null; toast("Saved");
}
async function editReq(id){
  const r=id?S.requests[id]:{date:todayISO(),status:"Requested",followUp:addBizDays(todayISO(),2),type:"new",covs:[]};
  const v=await form(id?"Edit request":"Log a request",[{k:"company",label:"Company",value:r.company,list:Object.values(S.holders).map(h=>h.name)},{k:"agentName",label:"Agent",value:r.agentName,list:agents().map(a=>a.name)},{k:"covs",label:"Coverage (GL, WC, UMB, AUTO)",value:(r.covs||[]).join(", ")},{k:"type",label:"Type",type:"select",options:TYPES,value:r.type},{k:"date",label:"Requested on",type:"date",value:r.date},{k:"status",label:"Status",type:"select",options:STATUS,value:r.status},{k:"followUp",label:"Follow up on",type:"date",value:r.followUp},{k:"notes",label:"Notes",type:"textarea",value:r.notes}],{del:!!id});
  if(!v) return; if(v.__delete){ if(await confirmBox("Delete this request?")) await w(`requests/${id}`,"delete"); return; }
  v.covs=v.covs.split(/[,\s]+/).map(x=>x.toUpperCase()).filter(Boolean);
  if(id) await w(`requests/${id}`,"update",v); else await w(`requests/${newId("requests")}`,"set",v); toast("Saved");
}
async function makeDrafts(btn){
  const h=S.holders[UI.hid]; const ds=UI.drafts; if(!h||!ds||!ds.length) return;
  btn.disabled=true; btn.textContent="Creating…"; let ok=0;
  for(const d of ds){
    try{ const r=await gmailDraft({to:d.to,cc:d.cc,subject:d.subject,text:d.text});
      await w(`requests/${newId("requests")}`,"set",{company:h.name,holderId:UI.hid,agent:d.agent,agentName:d.agentName,covs:d.covs,type:UI.type,date:todayISO(),status:"Requested",followUp:addBizDays(todayISO(),2),notes:UI.site?`Job site: ${UI.site}`:"",draftUrl:r.viewUrl||"",subject:d.subject});
      ok++;
    }catch(e){ modal(`<h3>Draft not created</h3><p>${esc(mcpErr(e))}</p><div class="mfoot"><button class="btn" data-a="x">OK</button></div>`,(m,c)=>m.querySelector("[data-a=x]").onclick=c); break; }
  }
  btn.disabled=false; btn.textContent="Create draft(s) in Gmail";
  if(ok){ toast(`${ok} draft${ok>1?"s":""} created and logged`); UI.view="log"; location.hash="#log"; }
}
async function followUp(id){
  const r=S.requests[id]; const a=agents().find(x=>x.key===r.agent)||agents().find(x=>x.name===r.agentName); if(!a){toast("Set up the agent first");return;}
  const text=`Hello ${a.greet},\n\nFollowing up on the certificate request for ${r.company} I sent on ${fmt(r.date)}. Do you have an update on when it will be ready?`;
  const v=await form("Follow-up draft",[{k:"text",label:"Message (signature added automatically)",type:"textarea",rows:8,value:text}],{saveLabel:"Create draft"});
  if(!v) return;
  try{ await gmailDraft({to:a.to.split(/[;,]\s*/),cc:[...a.cc.split(/[;,]\s*/).filter(Boolean),ALWAYS_CC],subject:`Re: ${r.subject||"COI request — "+r.company}`,text:v.text});
    await w(`requests/${id}`,"update",{followUp:addBizDays(todayISO(),2),notes:((r.notes?r.notes+" · ":"")+`Followed up ${fmt(todayISO())}`)}); toast("Follow-up draft created"); }
  catch(e){ toast(mcpErr(e)); }
}
function render(){
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===UI.view));
  const nDue=Object.values(S.requests).filter(r=>r.status!=="Approved"&&validISO(r.followUp)&&r.followUp<=todayISO()).length; $("#navN").hidden=!nDue; $("#navN").textContent=nDue;
  if(!S.loaded.all){ $("#main").innerHTML=shellNotes()+`<div class="empty">Loading…</div>`; return; }
  const fid=document.activeElement&&document.activeElement.id;
  $("#main").innerHTML=shellNotes()+({new:renderNew,log:renderLog,holders:renderHolders,agents:renderAgents}[UI.view]||renderNew)();
  if(fid==="hSearch"){const e=$("#hSearch");e.focus();e.setSelectionRange(e.value.length,e.value.length);}
}
function route(){ const h=(location.hash||"#new").slice(1); UI.view=["new","log","holders","agents"].includes(h)?h:"new"; render(); }
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-ehr],[data-ea],.card.click"); if(!t) return; const d=t.dataset;
  try{
    if(d.eh!==undefined) return editHolder(d.eh);
    if(d.ehr) return editHolder(d.ehr);
    if(d.ea!==undefined) return editAgent(d.ea);
    if(d.rf){ UI.reqFilter=d.rf; return render(); }
    if(t.id==="makeDrafts") return makeDrafts(t);
    if(t.id==="copyDrafts"){ const txt=UI.drafts.map(x=>`To: ${x.to.join(", ")}\nCC: ${x.cc.join(", ")}\nSubject: ${x.subject}\n\n${x.text}\n\n${SIG_TEXT}`).join("\n\n----------\n\n"); try{await navigator.clipboard.writeText(txt);toast("Copied");}catch(err){toast("Copy blocked — select the text instead");} return; }
    if(t.id==="resetDrafts"){ UI.drafts=null; return render(); }
    if(t.id==="addReq") return editReq(null);
    if(d.er) return editReq(d.er);
    if(d.fu) return followUp(d.fu);
  }catch(err){}
});
document.addEventListener("change",async e=>{
  const el=e.target, id=el.id;
  if(id==="hid"){ UI.hid=el.value; UI.covs=guessCovs(S.holders[UI.hid]); UI.drafts=null; return render(); }
  if(id==="rtype"){ UI.type=el.value; UI.drafts=null; return render(); }
  if(id==="deliver"){ UI.deliver=el.value; UI.drafts=null; return render(); }
  if(id==="sample"){ UI.sample=el.checked; UI.drafts=null; return render(); }
  if(el.dataset.cov){ UI.covs[el.dataset.cov]=el.checked; UI.drafts=null; return render(); }
  if(["site","issue","notes","pmEmail"].includes(id)){ UI[id]=el.value; UI.drafts=null; return render(); }
  if(el.dataset.rq){ const [rid,f]=el.dataset.rq.split("|"); try{ await w(`requests/${rid}`,"update",{[f]:el.value}); toast("Saved"); }catch(err){} }
});
document.addEventListener("input",e=>{ const el=e.target;
  if(el.dataset.dk){ const [i,k]=el.dataset.dk.split("|"); const d=UI.drafts[+i]; d[k]=(k==="to"||k==="cc")?el.value.split(/[;,]\s*/).filter(Boolean):el.value; }
  if(el.id==="hSearch"){ UI.hSearch=el.value; render(); }
});
window.addEventListener("hashchange",route);
route(); bootDb(["holders","requests"],["config/agents"]);

})();</script></body></html>
